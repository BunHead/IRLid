# D1 migrations for the org database (review 2.2).
#
# MANUAL ONLY. Nothing here runs on push or merge. Two gates stand before any
# step that talks to the live database:
#   1. Whoever starts it must type the database name (irlid-db-org) in "confirm".
#   2. The job runs in the "d1-production" environment. Spencer must add
#      himself as a required reviewer there (Settings -> Environments ->
#      d1-production -> Required reviewers), so the job waits for his approval.
#
# Actions:
#   export-schema     read-only: exports the live schema (no data) as a build
#                     artifact, so schema.sql can be regenerated from the truth.
#   apply-migrations  lists pending migrations from irlid-api-org/d1-migrations,
#                     then applies them.

name: D1 migrations (org database)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options:
          - export-schema
          - apply-migrations
      confirm:
        description: "Type the database name (irlid-db-org) to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-org-database
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  d1:
    needs: tests
    runs-on: ubuntu-latest
    environment: d1-production
    defaults:
      run:
        working-directory: irlid-api-org
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "irlid-db-org" ]; then
            echo "Confirmation did not match the database name. Nothing was done."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export live schema (no data)
        if: inputs.action == 'export-schema'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_070626 }}
        run: npx --yes wrangler@4.157.0 d1 export irlid-db-org --remote --no-data --output live-schema.sql

      - name: Upload exported schema
        if: inputs.action == 'export-schema'
        uses: actions/upload-artifact@v4
        with:
          name: live-schema
          path: irlid-api-org/live-schema.sql
          retention-days: 7

      - name: List pending migrations
        if: inputs.action == 'apply-migrations'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_070626 }}
        run: npx --yes wrangler@4.157.0 d1 migrations list irlid-db-org --remote

      - name: Apply migrations
        if: inputs.action == 'apply-migrations'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_070626 }}
        run: npx --yes wrangler@4.157.0 d1 migrations apply irlid-db-org --remote
