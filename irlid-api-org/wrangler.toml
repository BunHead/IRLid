name = "irlid-api-org"
main = "src/index.js"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ORIGIN = "https://irlid.co.uk"

[[d1_databases]]
binding = "DB"
database_name = "irlid-db-org"
database_id = "484dad86-e75c-412e-9423-ca0bb27cdcb8"
# Numbered, wrangler-tracked migrations (review 2.2). Not ./migrations, which
# holds the hand-applied history and must never be re-run.
migrations_dir = "d1-migrations"

# Push updates (Org dashboard). One OrgHub Durable Object per org, holding the
# dashboard's WebSockets. SQLite-backed so it also runs on the Workers Free plan.
[[durable_objects.bindings]]
name = "ORG_HUB"
class_name = "OrgHub"

[[migrations]]
tag = "v1-org-hub"
new_sqlite_classes = ["OrgHub"]

# Keep Workers Logs switched on across deploys (enabled in the dashboard on
# 04/11/2026; a deploy without this block could turn it off).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
